aid: apache-cloudstack
name: Apache CloudStack
description: Apache CloudStack is an open-source cloud computing platform developed by the Apache Software Foundation for
  creating, managing, and deploying infrastructure cloud services. It provides a comprehensive IaaS platform supporting multiple
  hypervisors (KVM, VMware vSphere, XenServer) and a rich API for programmatic cloud resource management. CloudStack is used
  by service providers and enterprises to build public, private, and hybrid cloud environments with virtual machine management,
  networking, storage, and multi-tenancy features.
